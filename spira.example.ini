[api]
# Copy to spira.ini and enter the DH8 project ID. Never copy the old API key here.
base_url = https://your-company.example/spirateam
project_id = REPLACE_WITH_DH8_PROJECT_ID
page_size = 250
verify_ssl = true
# Optional PEM file containing your trusted corporate CA certificates.
ca_bundle =
# API version segment of /Services/<version>/RestService.svc. Check your server's
# https://<host>/<app>/Services/<version>/RestService.aspx help page if you get HTTP 404.
api_version = v7_0
# Set to false to connect directly and ignore HTTPS_PROXY / system proxy settings.
use_proxy = true
